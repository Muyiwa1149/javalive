server
{
    listen 80;
    listen [::]:80;

    server_name velnorapartners.com www.velnorapartners.com;

    root /www/wwwroot/velnorapartners.com;
    index index.html;

    include /www/server/panel/vhost/nginx/well-known/velnorapartners.com.conf;

    location ~ ^/\.well-known/ {
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server
{
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name velnorapartners.com www.velnorapartners.com;

    root /www/wwwroot/velnorapartners.com;
    index index.html;

    ssl_certificate     /www/server/panel/vhost/cert/velnorapartners.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/velnorapartners.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /actuator/ {
        proxy_pass http://127.0.0.1:8080/actuator/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /storage/ {
        proxy_pass http://127.0.0.1:8080/storage/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    location ~* \.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000" always;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /www/wwwlogs/velnorapartners.com.log;
    error_log  /www/wwwlogs/velnorapartners.com.error.log;
}
