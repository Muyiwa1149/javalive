server {
    listen 80;
    server_name _;

    client_max_body_size 25m;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API — proxied to the Spring Boot service (named "backend" in docker-compose).
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uploaded/migrated media (KYC docs, deposit proofs, avatars, etc.), served by the backend.
    location /storage/ {
        proxy_pass http://backend:8080/storage/;
        proxy_set_header Host $host;
    }

    # Vue Router history mode — fall back to index.html for any non-file, non-API route.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
