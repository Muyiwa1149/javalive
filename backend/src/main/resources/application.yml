spring:
  application:
    name: javalive-backend

  profiles:
    active: dev

  # Optional, gitignored local overlay for secrets that shouldn't live in source control even as
  # dev defaults (e.g. a real third-party API key) — see application-local.yml.example.
  config:
    import: "optional:classpath:application-local.yml"

  datasource:
    url: jdbc:mysql://localhost:3306/javalive_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: localhost
    port: 1025
    from: no-reply@javalive.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  task:
    scheduling:
      pool:
        # Spring Boot's default @Scheduled executor is single-threaded, which lets one slow job
        # (MarketPriceScheduler's rate-limited per-instrument CoinGecko loop, observed taking 2+
        # minutes) starve every other @Scheduled job behind it. One thread per scheduler class.
        size: 8

server:
  port: 8080
  tomcat:
    # App Settings posts every field as its own multipart part alongside the logo/favicon files
    # (AppSetting has 90+ columns) — Tomcat's default cap of 10 parts per request rejects that.
    max-part-count: 200

management:
  health:
    mail:
      enabled: false

javalive:
  storage:
    public-path: ./storage/public
  jwt:
    secret: "dev-only-secret-change-in-production-CHANGE-ME-32bytes-min"
    access-token-minutes: 60
    refresh-token-days: 14
  cors:
    # Pattern, not a fixed list — this machine runs several unrelated projects that grab Vite's
    # default port first, so the dev frontend often ends up on a different localhost port than 5173.
    allowed-origins: "http://localhost:*"
  frontend-url: "http://localhost:5173"
  encryption:
    # Dev-only AES-256 key (32 raw bytes, base64-encoded) — CHANGE IN PRODUCTION and manage via a
    # real secrets store. Used for at-rest encryption of sensitive user-supplied secrets (wallet
    # recovery phrases, MT4 passwords) that the source app stored in plaintext.
    key: "tCvo2yvHnGnBCpsOQbmzWefS94SAYxuMPkJZ2XQ4GIo="
  finnhub:
    # Real key lives in the gitignored application-local.yml (see application-local.yml.example) —
    # empty here means the stock/forex/index/commodity price jobs just no-op until it's supplied.
    api-key: ""
