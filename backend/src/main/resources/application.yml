spring:
  application:
    name: javalive-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/javalive_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: localhost
    port: 1025
    from: no-reply@javalive.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 25MB

server:
  port: 8080

management:
  health:
    mail:
      enabled: false

javalive:
  storage:
    public-path: ./storage/public
  jwt:
    secret: "dev-only-secret-change-in-production-CHANGE-ME-32bytes-min"
    access-token-minutes: 60
    refresh-token-days: 14
  cors:
    allowed-origins: "http://localhost:5173"
  frontend-url: "http://localhost:5173"
  encryption:
    # Dev-only AES-256 key (32 raw bytes, base64-encoded) — CHANGE IN PRODUCTION and manage via a
    # real secrets store. Used for at-rest encryption of sensitive user-supplied secrets (wallet
    # recovery phrases, MT4 passwords) that the source app stored in plaintext.
    key: "tCvo2yvHnGnBCpsOQbmzWefS94SAYxuMPkJZ2XQ4GIo="
