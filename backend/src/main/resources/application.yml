spring:
  application:
    name: javalive-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3306/javalive_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  mail:
    host: localhost
    port: 1025
    from: no-reply@javalive.local
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: 8080

management:
  health:
    mail:
      enabled: false

javalive:
  jwt:
    secret: "dev-only-secret-change-in-production-CHANGE-ME-32bytes-min"
    access-token-minutes: 60
    refresh-token-days: 14
  cors:
    allowed-origins: "http://localhost:5173"
